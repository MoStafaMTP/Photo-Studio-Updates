name: Import verified 1.2.4 installer
on:
  workflow_dispatch:
    inputs:
      installer_url:
        description: Temporary download link for the verified installer
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified installer
        env:
          INSTALLER_URL: ${{ inputs.installer_url }}
        run: |
          echo "::add-mask::$INSTALLER_URL"
          mkdir assets
          curl --fail --location --retry 3 --silent --show-error "$INSTALLER_URL" -o 'assets/Photo-Studio-Setup-1.2.4-x64.exe'
          echo '27e7d355385dc10c4bd5b6ae884d87483e123cdf705316a9c5824c98897be8ca  assets/Photo-Studio-Setup-1.2.4-x64.exe' | sha256sum --check
      - name: Upload only to the unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v1.2.4 --repo MoStafaMTP/Photo-Studio-Updates --json isDraft --jq .isDraft)" = true
          gh release upload v1.2.4 'assets/Photo-Studio-Setup-1.2.4-x64.exe' --repo MoStafaMTP/Photo-Studio-Updates
