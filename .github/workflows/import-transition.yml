name: Import verified 1.2.3 installer
on:
  workflow_dispatch:
    inputs:
      installer_url:
        description: Temporary download link for the verified installer
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified installer
        env:
          INSTALLER_URL: ${{ inputs.installer_url }}
        run: |
          echo "::add-mask::$INSTALLER_URL"
          mkdir assets
          curl --fail --location --retry 3 --silent --show-error "$INSTALLER_URL" -o 'assets/Photo-Studio-Setup-1.2.3-x64.exe'
          echo '4f0aef2df6b1ca4fdc5cce64b7109f21a7a24a7ae1b5207c35320d4fd4582f04  assets/Photo-Studio-Setup-1.2.3-x64.exe' | sha256sum --check
      - name: Upload only to the unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v1.2.3 --repo MoStafaMTP/Photo-Studio-Updates --json isDraft --jq .isDraft)" = true
          gh release upload v1.2.3 'assets/Photo-Studio-Setup-1.2.3-x64.exe' --repo MoStafaMTP/Photo-Studio-Updates
