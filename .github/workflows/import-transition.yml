name: Import verified 1.2.2 installer
on:
  workflow_dispatch:
    inputs:
      installer_url:
        description: Temporary download link for the verified installer
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified installer
        env:
          INSTALLER_URL: ${{ inputs.installer_url }}
        run: |
          echo "::add-mask::$INSTALLER_URL"
          mkdir assets
          curl --fail --location --retry 3 --silent --show-error "$INSTALLER_URL" -o 'assets/Photo-Studio-Setup-1.2.2-x64.exe'
          echo '041923451efd27e58df8d4df51e517f60562ae85426e9479ce3964e22a77206f  assets/Photo-Studio-Setup-1.2.2-x64.exe' | sha256sum --check
      - name: Upload only to the unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v1.2.2 --repo MoStafaMTP/Photo-Studio-Updates --json isDraft --jq .isDraft)" = true
          gh release upload v1.2.2 'assets/Photo-Studio-Setup-1.2.2-x64.exe' --repo MoStafaMTP/Photo-Studio-Updates
