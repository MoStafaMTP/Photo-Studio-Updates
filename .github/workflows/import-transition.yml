name: Import verified Windows update assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (for example v1.2.0)
        required: true
        type: string
      installer_sha256:
        description: Verified installer SHA-256
        required: true
        type: string
      blockmap_sha256:
        description: Verified blockmap SHA-256
        required: true
        type: string
      manifest_sha256:
        description: Verified latest.yml SHA-256
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the reviewed build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
          BLOCKMAP_SHA256: ${{ inputs.blockmap_sha256 }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for hash in "$INSTALLER_SHA256" "$BLOCKMAP_SHA256" "$MANIFEST_SHA256"; do
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
          done
          installer="Photo-Studio-Setup-${VERSION#v}-x64.exe"
          test "$(gh release view "$VERSION" --repo MoStafaMTP/Photo-Studio --json isPrerelease --jq .isPrerelease)" = true
          mkdir assets
          gh release download "$VERSION" --repo MoStafaMTP/Photo-Studio --dir assets --pattern "$installer" --pattern "$installer.blockmap" --pattern latest.yml
          cd assets
          printf '%s\n' \
            "$INSTALLER_SHA256  $installer" \
            "$BLOCKMAP_SHA256  $installer.blockmap" \
            "$MANIFEST_SHA256  latest.yml" | sha256sum --check
      - name: Upload to the reviewed updates draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(gh release view "$VERSION" --repo MoStafaMTP/Photo-Studio-Updates --json isDraft --jq .isDraft)" = true
          gh release upload "$VERSION" assets/* --clobber --repo MoStafaMTP/Photo-Studio-Updates
